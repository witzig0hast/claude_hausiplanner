services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: homework
      POSTGRES_PASSWORD: homework
      POSTGRES_DB: homework
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./apps/api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      HOMEWORK_DATABASE_URL: postgresql+psycopg://homework:homework@postgres:5432/homework
      HOMEWORK_JWT_SECRET: ${JWT_SECRET:?set a random secret in .env}
      HOMEWORK_OLLAMA_BASE_URL: http://host.docker.internal:11434
      HOMEWORK_OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      HOMEWORK_OLLAMA_VISION_MODEL: ${VISION_MODEL:-llava}
      HOMEWORK_OLLAMA_VOICE_MODEL: ${VOICE_MODEL:-}
      HOMEWORK_WEB_BASE_URL: ${PUBLIC_WEB_URL:-https://homework.example-domain.de}
      HOMEWORK_WHISPER_HOST: host.docker.internal
      HOMEWORK_WHISPER_PORT: ${WHISPER_PORT:-10300}
      HOMEWORK_SMTP_HOST: ${SMTP_HOST:-}
      HOMEWORK_SMTP_PORT: ${SMTP_PORT:-587}
      # Accepts SMTP_USERNAME/SMTP_USE_TLS/SMTP_FROM_EMAIL (this project's documented names) or
      # SMTP_USER/SMTP_SECURE/SMTP_FROM (another common convention) - whichever is set in .env,
      # so a wrong name doesn't silently leave a field empty (e.g. no SMTP_USERNAME means no
      # AUTH is sent at all, which gets the connection rejected as an anonymous relay attempt).
      HOMEWORK_SMTP_USERNAME: ${SMTP_USERNAME:-${SMTP_USER:-}}
      HOMEWORK_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      HOMEWORK_SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-${SMTP_FROM:-}}
      HOMEWORK_SMTP_USE_TLS: ${SMTP_USE_TLS:-${SMTP_SECURE:-true}}
      # OwnAI Agent Bus - each user connects their own OwnAI account from their own Settings
      # page (API key, encrypted at rest). This is only the shared default base_url (used unless
      # a user sets their own override) - not a server-wide on/off switch or a single shared key.
      HOMEWORK_OWNAI_AGENT_BUS_BASE_URL: ${OWNAI_AGENT_BUS_BASE_URL:-https://ownai.hastnetwork.de/api/v1}
      # Encrypts every user's stored Agent Bus API key at rest - set a random value in .env
      # before any user connects their OwnAI account (the insecure built-in default is fine
      # until then, same as JWT_SECRET's own default).
      HOMEWORK_SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-change-me-in-production}
      HOMEWORK_MAX_ATTACHMENT_BYTES: ${MAX_ATTACHMENT_BYTES:-20971520}
      # SSO login via any OpenID Connect provider (e.g. Authentik) - optional, password
      # login/register keeps working either way. OIDC_ISSUER is the provider's base URL (its
      # "/.well-known/openid-configuration" is discovered from there automatically).
      HOMEWORK_OIDC_ISSUER: ${OIDC_ISSUER:-}
      HOMEWORK_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      HOMEWORK_OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      HOMEWORK_OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
    volumes:
      # Homework material uploads (PDFs, images, ...) - must be a persistent volume, or every
      # uploaded file is lost the next time this container is recreated (e.g. `up -d --build`).
      - homework_uploads:/app/uploads
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL:-https://homework-api.example-domain.de}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  homework_uploads:
