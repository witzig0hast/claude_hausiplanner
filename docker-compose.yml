services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: homework
      POSTGRES_PASSWORD: homework
      POSTGRES_DB: homework
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./apps/api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      HOMEWORK_DATABASE_URL: postgresql+psycopg://homework:homework@postgres:5432/homework
      HOMEWORK_JWT_SECRET: ${JWT_SECRET:?set a random secret in .env}
      HOMEWORK_OLLAMA_BASE_URL: http://host.docker.internal:11434
      HOMEWORK_OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      HOMEWORK_OLLAMA_VISION_MODEL: ${VISION_MODEL:-llava}
      HOMEWORK_OLLAMA_VOICE_MODEL: ${VOICE_MODEL:-}
      HOMEWORK_WEB_BASE_URL: ${PUBLIC_WEB_URL:-https://homework.example-domain.de}
      HOMEWORK_WHISPER_HOST: host.docker.internal
      HOMEWORK_WHISPER_PORT: ${WHISPER_PORT:-10300}
      HOMEWORK_SMTP_HOST: ${SMTP_HOST:-}
      HOMEWORK_SMTP_PORT: ${SMTP_PORT:-587}
      HOMEWORK_SMTP_USERNAME: ${SMTP_USERNAME:-}
      HOMEWORK_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      HOMEWORK_SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      HOMEWORK_SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL:-https://homework-api.example-domain.de}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
